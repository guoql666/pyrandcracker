[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrandcracker"
version = "0.4.0"
description = "Recover Python random.Random state from its outputs (MT19937)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "tqdm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
"Homepage" = "https://github.com/guoql666"
"Bug Tracker" = "https://github.com/guoql666/pyrandcracker/issues"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
